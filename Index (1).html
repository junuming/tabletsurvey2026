<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>스마트CM 태블릿PC 사용 보고</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: one centered 1000px column on a navy-tinted ground — white header with the MOOYOUNG CM logo, a CI-navy band opening each screen, white cards below. Colors taken from the company CI: navy #102079, red #D6071C, grey #969697. */
:root{
  --bg:#edf0f7; --surface:#ffffff; --surface-2:#f3f5fb; --overlay:rgba(10,16,48,.5);
  --ink:#131a38; --ink-2:#4a5272; --muted:#7a8199; --line:#d6dcea; --line-2:#e5e9f3;
  --accent:#102079; --accent-soft:#e7ebf8; --accent-ink:#ffffff;
  --ci-navy:#102079; --ci-red:#d6071c; --ci-grey:#969697;
  --band:#102079; --band-2:#1a2d93; --band-ink:#ffffff; --band-sub:#c3cbef; --band-line:rgba(255,255,255,.26); --band-hover:rgba(255,255,255,.1);
  --band-btn:#ffffff; --band-btn-ink:#102079; --logo-plate:transparent; --brand-ink:#102079;
  --sage:#3550c4; --sage-ink:#102079; --sage-soft:#e3e8f8; --brown:#d6071c;
  --gA:#3550c4; --gB:#1f9aa6; --gC:#d81f33;
  --gA-ink:#2a43b5; --gA-bg:#edf0fc; --gA-line:#c2ccf3;
  --gB-ink:#13737c; --gB-bg:#e6f5f6; --gB-line:#b2dfe3;
  --gC-ink:#c41a2d; --gC-bg:#fdecee; --gC-line:#f5c1c8;
  --good:#2f8650; --good-bg:#e7f4ec; --warn:#ad7306; --warn-bg:#fcf2de; --bad:#cf1b2e; --bad-bg:#fdeaec;
  --f1:#13217a; --f2:#3550c4; --f3:#7e94db; --f4:#bfcaee; --f5:#e4e8f6; --on-f:#ffffff;
  --shadow:0 10px 28px rgba(16,32,121,.08); --shadow-lg:0 18px 50px rgba(16,32,121,.2); --card-shadow:0 1px 3px rgba(16,32,121,.06);
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  --r-card:22px; --r-inner:16px; --r-ctl:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0a0f24; --surface:#131a33; --surface-2:#1a2242; --overlay:rgba(0,0,0,.62);
  --ink:#e8ebf6; --ink-2:#b7bed8; --muted:#8890ab; --line:#29315a; --line-2:#20284a;
  --accent:#a3b2ff; --accent-soft:#1c2552; --accent-ink:#0a0f24;
  --band:#16237a; --band-2:#1f3092; --band-sub:#b9c3ee; --logo-plate:#ffffff; --brand-ink:#e8ebf6;
  --sage:#7486f2; --sage-ink:#a3b2ff; --sage-soft:#1d2652; --brown:#ff5b6b;
  --gA:#6f7ff5; --gB:#1ea4ae; --gC:#e8475a;
  --gA-ink:#a6b2ff; --gA-bg:#1b2350; --gA-line:#34418a;
  --gB-ink:#62d3da; --gB-bg:#11303a; --gB-line:#1f5a63;
  --gC-ink:#ff8b97; --gC-bg:#3a1820; --gC-line:#6e2a35;
  --good:#6cc28a; --good-bg:#14291f; --warn:#e2b04a; --warn-bg:#2e2513; --bad:#ff6b78; --bad-bg:#3a1820;
  --f1:#bcc6ff; --f2:#8193f2; --f3:#5263c4; --f4:#323f86; --f5:#222b5a; --on-f:#0a0f24;
  --shadow:0 10px 28px rgba(0,0,0,.4); --shadow-lg:0 18px 50px rgba(0,0,0,.6); --card-shadow:none;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0a0f24; --surface:#131a33; --surface-2:#1a2242; --overlay:rgba(0,0,0,.62);
  --ink:#e8ebf6; --ink-2:#b7bed8; --muted:#8890ab; --line:#29315a; --line-2:#20284a;
  --accent:#a3b2ff; --accent-soft:#1c2552; --accent-ink:#0a0f24;
  --band:#16237a; --band-2:#1f3092; --band-sub:#b9c3ee; --logo-plate:#ffffff; --brand-ink:#e8ebf6;
  --sage:#7486f2; --sage-ink:#a3b2ff; --sage-soft:#1d2652; --brown:#ff5b6b;
  --gA:#6f7ff5; --gB:#1ea4ae; --gC:#e8475a;
  --gA-ink:#a6b2ff; --gA-bg:#1b2350; --gA-line:#34418a;
  --gB-ink:#62d3da; --gB-bg:#11303a; --gB-line:#1f5a63;
  --gC-ink:#ff8b97; --gC-bg:#3a1820; --gC-line:#6e2a35;
  --good:#6cc28a; --good-bg:#14291f; --warn:#e2b04a; --warn-bg:#2e2513; --bad:#ff6b78; --bad-bg:#3a1820;
  --f1:#bcc6ff; --f2:#8193f2; --f3:#5263c4; --f4:#323f86; --f5:#222b5a; --on-f:#0a0f24;
  --shadow:0 10px 28px rgba(0,0,0,.4); --shadow-lg:0 18px 50px rgba(0,0,0,.6); --card-shadow:none;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
body.noscroll{overflow:hidden}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{text-wrap:balance;margin:0}
p{margin:0}
.ic{width:18px;height:18px;flex:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{border-bottom:1px solid var(--line);background:var(--surface)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;min-width:0}
.ci{display:block;flex:none;background:var(--logo-plate);border-radius:10px;padding:5px 8px;margin-left:-8px}
.ci img{display:block;height:36px;width:auto;max-width:none}
.brand-txt{border-left:1px solid var(--line);padding-left:14px;min-width:0}
.brand b{display:block;font-size:16px;font-weight:900;letter-spacing:-.01em;line-height:1.2;color:var(--brand-ink)}
.brand small{display:block;font-size:12.5px;color:var(--muted);line-height:1.3}
.nav{display:flex;gap:2px;flex-wrap:nowrap;justify-content:flex-end;flex:none}
.nav a{text-decoration:none;color:var(--muted);font-weight:500;padding:8px 10px;border-radius:10px;font-size:14.5px;white-space:nowrap}
.nav a:hover{color:var(--ink);background:var(--surface-2)}
.nav a.on{color:var(--ink);font-weight:700}

main{padding-block:36px 40px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:26px}
.page-head h1{font-size:clamp(28px,4.4vw,36px);font-weight:900;letter-spacing:-.02em;line-height:1.25}
.page-head .sub{color:var(--ink-2);margin-top:6px;font-size:15.5px}
.head-acts{display:flex;gap:8px;flex-wrap:wrap}
.band{position:relative;overflow:hidden;isolation:isolate;background:var(--band);color:var(--band-ink);border-radius:var(--r-card)}
.band::before{content:"";position:absolute;z-index:-1;right:-130px;top:-170px;width:440px;height:310px;border-radius:50%;background:var(--band-2);transform:rotate(-14deg)}
.band::after{content:"";position:absolute;z-index:-1;right:-118px;top:-158px;width:440px;height:310px;border-radius:50%;border-bottom:5px solid var(--ci-red);transform:rotate(-14deg)}
.page-head.band{padding:30px 32px;margin-bottom:22px}
.page-head.band::before{top:-236px}
.page-head.band::after{top:-224px}
.page-head.band .sub{color:var(--band-sub)}
.band .btn{background:var(--band);border-color:var(--band-line);color:var(--band-ink)}
.band .btn:hover{background:var(--band-2)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:26px 28px;margin-bottom:20px;box-shadow:var(--card-shadow)}
.card-title{font-size:18px;font-weight:700;letter-spacing:-.01em}
.card-sub{color:var(--muted);font-size:13.5px;margin-top:4px}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:999px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}

/* home */
.hero{padding-block:44px 34px}
.hero.band{padding:46px 40px 42px;margin-bottom:22px}
.hero.band .eyebrow,.hero.band .lead{color:var(--band-sub)}
.eyebrow{font-size:13.5px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin-bottom:18px}
.hero h1{font-size:clamp(30px,5.6vw,46px);font-weight:900;letter-spacing:-.025em;line-height:1.28}
.hero .lead{color:var(--ink-2);font-size:16.5px;margin-top:20px;max-width:640px;line-height:1.75}
.cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:34px;align-items:center}
.cta-main{display:inline-flex;align-items:center;gap:10px;padding:15px 26px;border-radius:14px;background:var(--band-btn);box-shadow:var(--shadow);border:0;color:var(--band-btn-ink);font-weight:900;font-size:16px;text-decoration:none}
.cta-main:hover{box-shadow:var(--shadow-lg)}
.cta-sub{padding:15px 18px;color:var(--band-ink);font-weight:700;text-decoration:none;border-radius:14px;border:1px solid var(--band-line)}
.cta-sub:hover{background:var(--band-hover)}
.kgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.hk{background:var(--surface);border-radius:20px;box-shadow:var(--card-shadow);border:1px solid var(--line);padding:24px 26px}
.hk-top{display:flex;justify-content:space-between;align-items:center;color:var(--ink-2);font-size:14px;font-weight:700}
.hk-top .ic{width:22px;height:22px;color:var(--accent)}
.hk-top .ic.warnc{color:var(--bad)}
.hk-val{margin-top:16px;display:flex;align-items:baseline;gap:6px}
.hk-val b{font-size:38px;font-weight:900;letter-spacing:-.02em;line-height:1}
.hk-val span{font-size:13px;font-weight:700;color:var(--ink-2)}
.hk-note{font-size:13px;color:var(--muted);margin-top:12px}
.features{padding-block:64px 10px;text-align:center}
.features h2{font-size:30px;font-weight:900;letter-spacing:-.02em}
.features > p{color:var(--ink-2);margin-top:6px}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:28px;text-align:left}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--card-shadow)}
.fcard .fi{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:14px}
.fcard h3{font-size:16.5px;font-weight:700}
.fcard p{color:var(--ink-2);font-size:14px;margin-top:6px}

/* survey */
.notice{border-radius:14px;padding:13px 16px;font-size:14px;margin-bottom:16px;display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line)}
.notice .ic{margin-top:2px}
.notice.warn{background:var(--warn-bg);border-color:transparent;color:var(--ink)}
.notice.warn .ic{color:var(--warn)}
.notice.info{background:var(--accent-soft);border-color:transparent}
.notice.info .ic{color:var(--accent)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 18px;margin-top:18px}
.fld label{display:block;font-size:13.5px;font-weight:700;color:var(--ink-2);margin-bottom:7px}
.fld label i{color:var(--bad);font-style:normal;margin-left:2px}
.inp{width:100%;min-height:48px;border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:15.5px;box-shadow:0 1px 2px rgba(18,26,42,.04)}
textarea.inp{padding:12px 14px;min-height:96px;resize:vertical;line-height:1.6}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:38px}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fld.err .inp{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-bg)}
.fld .help{font-size:12.5px;color:var(--muted);margin-top:6px}
.unit-wrap{display:flex;align-items:center;gap:10px}
.unit-wrap .inp{max-width:200px}
.unit-wrap span{color:var(--ink-2);font-weight:700}
.prog-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.prog-txt{color:var(--ink-2);font-size:14px}
.prog-txt b{color:var(--accent);font-weight:900}
.prog-track{height:8px;border-radius:99px;background:var(--surface-2);margin-top:14px;overflow:hidden}
.prog-track i{display:block;height:100%;background:var(--accent);border-radius:99px;width:0;transition:width .3s}
.sec-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.sc{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.sc b{font-weight:700;color:var(--ink)}
.sc.done{border-color:var(--good);color:var(--good)}
.sc.done b{color:var(--good)}
.qsec-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.qsec-head h2{font-size:19px;font-weight:900;letter-spacing:-.01em}
.tag{font-size:12px;font-weight:700;color:var(--ink-2);background:var(--surface-2);border-radius:999px;padding:3px 10px}
.qlist{display:grid;gap:14px}
.q{border:1px solid var(--line);border-radius:var(--r-inner);padding:20px 22px;background:var(--surface);scroll-margin-top:20px}
.q.is-missing{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-bg)}
.q-top{display:flex;gap:14px}
.q-no{font-size:13px;font-weight:700;color:var(--muted);min-width:28px;padding-top:2px;font-variant-numeric:tabular-nums}
.q-text{font-size:16px;font-weight:700;line-height:1.6;flex:1;min-width:0}
.q-text .opt{font-size:12px;font-weight:500;color:var(--muted);margin-left:8px}
.q-hint{color:var(--muted);font-size:13.5px;margin:6px 0 0 42px}
.q-body{margin:14px 0 0 42px;display:grid;gap:12px}
.miss-msg{color:var(--bad);font-size:13px;font-weight:700;margin:10px 0 0 42px}
.chs{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.chs.wide{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.ch{min-height:48px;border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--surface);padding:6px 12px;font-size:14.5px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;line-height:1.35;transition:background .12s,border-color .12s}
.ch:hover{border-color:var(--ink-2)}
.ch.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.ch.mul .ic{width:16px;height:16px;opacity:0}
.ch.mul.on .ic{opacity:1}
.ch.st0.on{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.ch.st1.on{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.ch.st2.on{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.ch[disabled]{opacity:.45;cursor:not-allowed}
.sub-block{border-radius:14px;background:var(--surface-2);padding:16px;display:grid;gap:12px}
.sub-block.badb{background:var(--bad-bg)}
.sub-label{font-size:13.5px;font-weight:700;color:var(--ink-2)}
.photos{display:grid;gap:10px}
.ph-head{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:700;color:var(--ink-2)}
.ph-head .cnt{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500}
.ph-head .cnt.ok{color:var(--good);font-weight:700}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.ph-grid:empty{display:none}
.thumb{position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb img,.gi img,td .tthumbs img,.qa-ph img{color:transparent;font-size:0}
.thumb .rm{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(10,14,20,.66);color:#fff;display:grid;place-items:center}
.thumb .rm .ic{width:14px;height:14px}
.thumb.loading{display:grid;place-items:center;color:var(--muted);font-size:12px}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ph-btns{display:flex;gap:8px;flex-wrap:wrap}
.btn-ph{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 16px;border-radius:var(--r-ctl);border:1px dashed var(--ink-2);background:var(--surface);font-weight:700;font-size:14px;cursor:pointer}
.btn-ph:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn-ph.off{opacity:.45;pointer-events:none}
.ph-hint{font-size:12.5px;color:var(--muted)}
.ph-err{font-size:13px;color:var(--bad);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ph-na{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:12px 14px}
.submit-spacer{height:96px}
#submitbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -10px 30px rgba(18,26,42,.08);padding-bottom:env(safe-area-inset-bottom,0px)}
.sb-in{display:flex;align-items:center;gap:14px;padding-block:12px}
.sb-status{font-size:14px;color:var(--ink-2);white-space:nowrap}
.sb-status b{color:var(--ink)}
.btn-submit{flex:1;min-height:52px;border-radius:14px;border:0;background:var(--surface-2);color:var(--muted);font-weight:900;font-size:16.5px}
.btn-submit.ready{background:var(--accent);color:var(--accent-ink)}
.btn-submit[disabled]{cursor:wait}
.done-card{text-align:center;padding:48px 28px}
.done-ic{width:64px;height:64px;border-radius:50%;background:var(--good-bg);color:var(--good);display:grid;place-items:center;margin:0 auto 18px}
.done-ic .ic{width:30px;height:30px}
.done-card h2{font-size:24px;font-weight:900}
.done-card p{color:var(--ink-2);margin-top:8px}
.done-score{display:inline-flex;gap:22px;margin-top:22px;padding:16px 24px;border-radius:16px;background:var(--surface-2);text-align:left}
.done-score div span{display:block;font-size:12.5px;color:var(--muted);font-weight:700}
.done-score div b{font-size:26px;font-weight:900}
.done-acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:26px}
.mine{font-size:14px}
.mine ul{margin:6px 0 0;padding-left:18px;color:var(--ink-2)}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 22px;min-width:0;box-shadow:var(--card-shadow)}
.kpi-top{display:flex;justify-content:space-between;align-items:center;gap:6px 8px;min-height:30px;flex-wrap:wrap}
.kpi-label{font-size:14px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.pill-btn{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--surface);white-space:nowrap}
.pill-btn .ic{width:14px;height:14px}
.pill-btn:hover{background:var(--surface-2)}
.kpi-val{margin-top:12px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.kpi-val b{font-size:36px;font-weight:900;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi-val span{font-size:13px;font-weight:700;color:var(--ink-2)}
.kpi-sub{font-size:12.5px;color:var(--muted);margin-top:8px}
.v-sage{color:var(--sage-ink)} .v-brown{color:var(--brown)} .v-ink{color:var(--ink)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.45fr);gap:20px}
.grid2 > .card{margin-bottom:0}
.stack{display:grid;gap:20px;margin-bottom:20px}
.stack > .card{margin-bottom:0}
.sec-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:40px 0 16px}
.sec-h h2{font-size:22px;font-weight:900;letter-spacing:-.02em;color:var(--brand-ink);display:flex;align-items:center;gap:10px}
.sec-h h2::before{content:"";width:5px;height:20px;border-radius:2px;background:var(--ci-red);flex:none}
.sec-h p{color:var(--muted);font-size:14px}
.chart{width:100%;min-width:0;overflow:hidden}
.chart svg{display:block;max-width:100%}
.chart .gl{stroke:var(--line-2);stroke-dasharray:3 3}
.chart .gl.base{stroke:var(--line);stroke-dasharray:none}
.chart .th{stroke:var(--ink-2);stroke-dasharray:5 4;stroke-width:1;opacity:.55}
.chart text{font-family:var(--font)}
.chart .tk,.chart .xl{fill:var(--muted);font-size:11.5px}
.chart .thl{fill:var(--ink-2);font-size:11px;font-weight:700}
.chart .vl{fill:var(--ink);font-size:12px;font-weight:700}
.chart .ctr{fill:var(--ink);font-size:26px;font-weight:900}
.chart .ctr2{fill:var(--muted);font-size:12px;font-weight:700}
.chart .ln{fill:none;stroke:var(--sage-ink);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--sage-soft);opacity:.8}
.chart .mk{fill:var(--surface);stroke:var(--sage-ink);stroke-width:2.2}
.chart-empty{display:grid;place-items:center;min-height:180px;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:14px}
.donut-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.legend{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-size:13.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.legend.sq i{border-radius:3px}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}
.hb{display:grid;gap:9px}
.hb-row{display:grid;grid-template-columns:minmax(0,210px) minmax(0,1fr) 58px;gap:12px;align-items:center;font-size:13.5px}
.hb-l{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.hb-t i{display:block;height:100%;background:var(--sage);border-radius:0 4px 4px 0;min-width:2px}
.hb-v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.hb-row.hl .hb-t i{background:var(--brown)}
.hb-row.hl .hb-l{color:var(--brown);font-weight:700}
.hb.compact .hb-row{grid-template-columns:minmax(0,1fr) 46px;gap:4px 10px}
.hb.compact .hb-l{grid-column:1 / -1;white-space:normal;font-size:13px}
.hb.compact .hb-t{height:10px}
.hb.compact .hb-v{font-size:12.5px}
.hb.compact .hb-row.best .hb-t i{background:var(--sage-ink)}
.sb{display:grid;gap:12px}
.sb-row{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 64px;gap:12px;align-items:center;font-size:13.5px}
.sb-l{color:var(--ink-2)}
.sb-t{display:flex;gap:2px;height:26px;border-radius:6px;overflow:hidden;background:var(--surface-2)}
.sb-t i{display:block;height:100%;min-width:3px}
.sb-t em{font-style:normal;color:var(--muted);font-size:12.5px;padding:3px 10px}
.sb-v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:13px}
.sb-v.bad{color:var(--bad)}
.legend-row{margin-top:16px}
.mini-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px;min-width:0;box-shadow:var(--card-shadow)}
.mini h3{font-size:15px;font-weight:700}
.mini .mq{font-size:12px;color:var(--muted);margin:2px 0 14px}
.stat4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}
.stat4 .stat{background:var(--surface);border:1px solid var(--line);box-shadow:var(--card-shadow)}
.stat{background:var(--surface-2);border-radius:16px;padding:16px 18px;min-width:0}
.stat span{display:block;font-size:13px;font-weight:700;color:var(--ink-2)}
.stat b{display:block;font-size:26px;font-weight:900;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat b small{font-size:13px;font-weight:700;color:var(--ink-2);margin-left:3px}
.stat em{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:13px;background:var(--surface-2);color:var(--ink-2)}
.chip b{color:var(--ink);font-variant-numeric:tabular-nums}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.bad b{color:var(--bad)}
.tbl-wrap{overflow-x:auto;margin-top:18px;border:1px solid var(--line-2);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line-2);vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:700;background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td .tthumbs{display:flex;gap:6px}
td .tthumbs button{width:44px;height:44px;border-radius:8px;overflow:hidden;border:1px solid var(--line);padding:0;background:var(--surface-2)}
td .tthumbs img{width:100%;height:100%;object-fit:cover;display:block}
.muted{color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:700;color:var(--ink-2)}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab span{font-weight:500;margin-left:4px;opacity:.75}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.gi{border:0;padding:0;background:none;text-align:left;min-width:0}
.gi .gimg{aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);max-width:100%}
.gi img{width:100%;height:100%;object-fit:cover;display:block}
.gi .gcap{font-size:12.5px;margin-top:6px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gi .gcap b{color:var(--ink);font-weight:700}
.empty{color:var(--muted);font-size:14px;padding:26px;text-align:center;border:1px dashed var(--line);border-radius:14px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-radius:16px;padding:14px 18px;margin-bottom:20px;background:var(--warn-bg);font-size:14px}
.banner b{font-weight:700}

/* results list */
.list-card{padding:0;overflow:hidden}
.list-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center;padding:24px 26px 18px}
.list-head > div{min-width:0;flex:1 1 280px}
.search{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:0 14px;min-height:48px;flex:0 1 330px;background:var(--surface);box-shadow:0 1px 2px rgba(18,26,42,.04);min-width:0}
.search .ic{color:var(--muted)}
.search input{border:0;outline:0;background:transparent;min-width:0;flex:1;font-size:15px;min-height:46px}
.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 26px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.filters > span{font-size:13.5px;color:var(--ink-2);margin-right:2px}
.fchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:0 12px;min-height:34px;font-size:13px;background:var(--surface);position:relative;max-width:220px}
.fchip .ic{width:14px;height:14px;flex:none}
.fchip .fv{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.fchip select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
.fchip:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.fchip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
button.fchip{cursor:pointer}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;font-size:13px;padding:6px 8px}
.row{border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row-main{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 26px;flex-wrap:wrap}
.row-info{min-width:0;flex:1 1 320px}
.row-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rt{font-size:17px;font-weight:900;letter-spacing:-.01em}
.row-meta{font-size:13.5px;color:var(--muted);margin-top:4px}
.row-acts{display:flex;gap:6px;align-items:center}
.btn-out{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 14px;min-height:40px;font-weight:700;font-size:13.5px}
.btn-out:hover{background:var(--surface-2)}
.btn-ghost{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--muted);font-size:13.5px;padding:0 10px;min-height:40px;border-radius:10px}
.btn-ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn-ghost .ic{width:16px;height:16px;transition:transform .2s}
.row.open .btn-ghost .ic{transform:rotate(180deg)}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 10px 1px 8px;font-size:13px;font-weight:900;border:1px solid}
.badge .ic{width:14px;height:14px}
.badge.A{color:var(--gA-ink);background:var(--gA-bg);border-color:var(--gA-line)}
.badge.B{color:var(--gB-ink);background:var(--gB-bg);border-color:var(--gB-line)}
.badge.C{color:var(--gC-ink);background:var(--gC-bg);border-color:var(--gC-line)}
.score-pill{font-size:13px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.bad-pill{font-size:12px;font-weight:700;color:var(--bad);background:var(--bad-bg);border-radius:999px;padding:2px 9px}
.exp{padding:0 26px 22px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.exp .stat b{font-size:20px}
.exp-wide{grid-column:1 / -1;background:var(--surface-2);border-radius:16px;padding:14px 18px;font-size:14px;display:grid;gap:8px}
.exp-wide dt{font-size:12.5px;font-weight:700;color:var(--muted)}
.exp-wide dd{margin:0;color:var(--ink)}
.more{padding:16px 26px;border-top:1px solid var(--line);text-align:center}

/* modal */
.modal{position:fixed;inset:0;z-index:60;background:var(--overlay);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));overflow-y:auto}
.m-panel{background:var(--surface);border-radius:22px;width:100%;max-width:780px;box-shadow:var(--shadow-lg);margin-block:auto}
.m-head{display:flex;justify-content:space-between;gap:12px;padding:22px 24px 16px;border-bottom:1px solid var(--line-2);position:sticky;top:0;background:var(--surface);border-radius:22px 22px 0 0;z-index:1}
.m-head h3{font-size:20px;font-weight:900;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.m-head .meta{color:var(--muted);font-size:13.5px;margin-top:4px}
.m-body{padding:18px 24px 24px}
.m-scores{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:22px}
.m-scores .stat b{font-size:22px}
.m-sec{margin-top:22px}
.m-sec h4{font-size:15.5px;font-weight:900;margin-bottom:8px}
.qa{display:grid}
.qa-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:11px 0;border-bottom:1px solid var(--line-2);align-items:start}
.qa-row:last-child{border-bottom:0}
.qa-q{font-size:14px;color:var(--ink-2);display:flex;gap:10px}
.qa-q .q-no{min-width:30px}
.qa-a{font-size:14px;font-weight:700;text-align:right;max-width:280px}
.qa-x{grid-column:1 / -1;margin-left:40px;font-size:13.5px;color:var(--ink);background:var(--surface-2);border-radius:10px;padding:10px 12px;white-space:pre-wrap}
.qa-ph{grid-column:1 / -1;margin-left:40px;display:flex;gap:8px;flex-wrap:wrap}
.qa-ph button{width:76px;height:76px;padding:0;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.qa-ph img{width:100%;height:100%;object-fit:cover;display:block}
.ap{display:inline-block;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:700;background:var(--surface-2)}
.ap.f0{background:var(--f1);color:var(--on-f)} .ap.f1{background:var(--f2);color:var(--on-f)} .ap.f2{background:var(--f3);color:var(--ink)} .ap.f3{background:var(--f4);color:var(--ink)} .ap.f4{background:var(--f5);color:var(--ink-2)}
.ap.s0{background:var(--good-bg);color:var(--good)} .ap.s1{background:var(--warn-bg);color:var(--warn)} .ap.s2{background:var(--bad-bg);color:var(--bad)}
.ap.none{background:none;color:var(--muted);font-weight:500}
.m-foot{padding:16px 24px 22px;border-top:1px solid var(--line-2);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;align-items:center}
.m-foot p{color:var(--bad);font-size:14px;font-weight:700;margin-right:auto}
.set-grid{display:grid;gap:18px}
.set-grid .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.lb{position:fixed;inset:0;z-index:70;background:rgba(5,8,12,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb img{max-width:100%;max-height:78vh;border-radius:10px;object-fit:contain}
.lb p{color:#e8edf1;font-size:14px;text-align:center}
.lb .icon-btn{position:absolute;top:max(16px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:var(--shadow-lg);max-width:calc(100% - 32px);text-align:center}
#tip{position:fixed;z-index:90;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;padding:7px 10px;border-radius:8px;max-width:260px;line-height:1.45;white-space:pre-line;box-shadow:var(--shadow)}
.loading-card{display:grid;place-items:center;gap:12px;min-height:240px;color:var(--muted)}

footer{border-top:1px solid var(--line-2);margin-top:30px}
.foot-in{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:22px 28px;color:var(--muted);font-size:13.5px}
body.has-bar footer{padding-bottom:84px}


/* command-center layout (home + dashboard) */
body.wide .wrap{max-width:1440px}
.cc-bar{position:relative;overflow:hidden;isolation:isolate;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;background:var(--band);color:var(--band-ink);border-radius:14px;padding:16px 22px;margin-bottom:14px}
.cc-bar::after{content:"";position:absolute;z-index:-1;left:0;bottom:0;width:22%;height:4px;background:var(--ci-red)}
.cc-bar h1{font-size:clamp(19px,2.3vw,25px);font-weight:900;text-align:center;letter-spacing:-.01em;line-height:1.3}
.cc-l{font-size:13px;font-weight:700;color:var(--band-sub);min-width:0}
.cc-r{display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.clock{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--band-ink);white-space:nowrap;margin-right:4px}
.cc-bar .btn{min-height:36px;padding:0 12px;font-size:13px;background:var(--band);border-color:var(--band-line);color:var(--band-ink)}
.cc-bar .btn:hover{background:var(--band-2)}
.cc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.cc-col{display:grid;gap:14px;align-content:stretch;min-width:0}
.cc4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.cc3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:14px}
.pn{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--card-shadow);min-width:0;display:flex;flex-direction:column}
.pn-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.pn-h h2{font-size:15px;font-weight:900;color:var(--brand-ink);letter-spacing:-.01em}
.pn-h span{font-size:12px;color:var(--muted)}
.pn-h.ctr{justify-content:center;flex-direction:column;align-items:center;gap:2px;margin-bottom:14px}
.pn-h.ctr h2{font-size:19px}
.pn-body{flex:1;min-height:0}
.pscroll{max-height:252px;overflow-y:auto;padding-right:4px}
.cc-center .core{flex:1;grid-auto-rows:1fr}
.core{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.core-t{background:var(--surface-2);border:1px solid var(--line-2);border-radius:12px;padding:16px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;min-height:138px;min-width:0;font:inherit;color:inherit}
button.core-t{cursor:pointer}
button.core-t:hover{border-color:var(--accent)}
.core-t .cl{font-size:14px;color:var(--ink-2);font-weight:500;line-height:1.35}
.core-t b{font-size:32px;font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.02em}
.core-t b small{font-size:14px;font-weight:700;margin-left:3px;color:var(--ink-2);letter-spacing:0}
.core-t .bar{width:72%;height:7px;border-radius:4px;background:var(--line-2);overflow:hidden}
.core-t .bar i{display:block;height:100%;background:var(--sage);border-radius:4px}
.core-t .sub{font-size:12px;color:var(--muted);line-height:1.3}
.core-t.red b{color:var(--brown)}
.core-t.red .bar i{background:var(--brown)}
.tb-wrap{overflow:auto;max-height:262px;border:1px solid var(--line-2);border-radius:10px}
.tb{border-collapse:collapse;width:100%;font-size:13px}
.tb th{position:sticky;top:0;background:var(--surface-2);color:var(--ink-2);font-weight:700;font-size:12px;padding:8px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
.tb td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tb tr:nth-child(even) td{background:var(--surface-2)}
.tb tr:last-child td{border-bottom:0}
.tb .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tb .c{text-align:center}
.tb .nm{max-width:220px}
.tb .ap{white-space:nowrap}
.tb-wrap.full{max-height:none}
.hb.sm{gap:7px}
.hb.sm .hb-row{grid-template-columns:minmax(0,118px) minmax(0,1fr) 44px;gap:8px;font-size:12.5px}
.hb.sm .hb-t{height:12px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:st}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;font-size:13.5px;color:var(--ink-2)}
.steps li::before{counter-increment:st;content:counter(st);width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:900;font-size:13px}
.steps b{display:block;color:var(--ink);font-size:14px}
.cta-big{display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:900;font-size:18px;text-decoration:none;margin-top:4px}
.cta-big:hover{filter:brightness(1.08)}
.cta-note{font-size:13px;color:var(--ink-2);text-align:center;margin-top:10px}
.cta-prog{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:14px}
.cta-prog i{display:block;height:100%;background:var(--accent)}
.gl-list{display:grid;gap:10px}
.gl-item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;font-size:13.5px;color:var(--ink-2)}
.tips{margin:0;padding-left:18px;display:grid;gap:8px;font-size:13.5px;color:var(--ink-2)}
.pn-empty{color:var(--muted);font-size:13.5px;text-align:center;padding:26px 10px;border:1px dashed var(--line);border-radius:10px}
.btn-del{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 12px;min-height:40px;font-weight:700;font-size:13.5px;color:var(--bad)}
.btn-del .ic{width:15px;height:15px}
.btn-del:hover{background:var(--bad-bg);border-color:var(--bad)}
.row-confirm{margin:0 26px 16px;padding:12px 16px;border-radius:12px;background:var(--bad-bg);color:var(--ink);font-size:13.5px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.row-confirm .ic{width:16px;height:16px;color:var(--bad);vertical-align:-3px}
.rc-acts{display:flex;gap:8px}
.btn.danger-fill{background:var(--bad);border-color:var(--bad);color:var(--on-f)}
.share-grid{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:20px;align-items:start}
.share-main{display:grid;gap:16px;min-width:0}
.copy-row{display:flex;gap:8px}
.copy-row .inp{min-width:0;flex:1;font-size:14px}
.share-qr{display:grid;gap:10px;justify-items:center}
.qr-box{width:200px;max-width:100%;aspect-ratio:1/1;background:#ffffff;border-radius:14px;border:1px solid var(--line);padding:10px;color:#102079}
.qr-box svg{width:100%;height:100%;display:block}
.qr-box svg rect[fill="#ffffff"],.qr-box svg rect[fill="white"]{fill:#ffffff}
.qr-box svg path{fill:#102079}
.lock-pn{max-width:560px;margin:40px auto;text-align:center;align-items:center;gap:14px;padding:40px 28px}
.lock-pn .ic{width:34px;height:34px;color:var(--accent)}
.login-row{display:flex;gap:8px;width:100%;max-width:360px}
.login-row .inp{flex:1;min-width:0}
@media (max-width:1100px){
  .cc{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cc-center{grid-column:1 / -1;order:-1}
  .cc.home .cc-center{order:1}
  .cc4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cc3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .cc,.cc4,.cc3{grid-template-columns:minmax(0,1fr)}
  .core{grid-template-columns:repeat(2,minmax(0,1fr))}
  .core-t{min-height:118px}
  .core-t b{font-size:26px}
  .cc-bar{grid-template-columns:minmax(0,1fr);text-align:center;padding:16px}
  .cc-l{text-align:center}
  .cc-r{justify-content:center}
}

@media (max-width:860px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .mini-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .exp{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:600px){
  main{padding-block:24px 30px}
  .card{padding:20px 18px}
  .kgrid,.form-grid{grid-template-columns:minmax(0,1fr)}
  .mini-grid{grid-template-columns:minmax(0,1fr)}
  .q{padding:16px}
  .q-hint,.q-body,.miss-msg{margin-left:0}
  .hb-row,.sb-row{grid-template-columns:minmax(0,1fr) 54px;gap:4px 10px}
  .hb-l,.sb-l{grid-column:1 / -1}
  .list-head,.filters{padding-left:18px;padding-right:18px}
  .row-main{padding:16px 18px}
  .exp{padding:0 18px 18px}
  .m-scores{grid-template-columns:repeat(2,minmax(0,1fr))}
  .qa-row{grid-template-columns:minmax(0,1fr)}
  .qa-a{text-align:left;margin-left:40px}
  .sb-status{display:none}
  .set-grid .row2{grid-template-columns:1fr}
  .share-grid{grid-template-columns:minmax(0,1fr)}
  .row-confirm{margin:0 18px 14px}
  .kpi-val b{font-size:30px}
  .brand-txt{display:none}
  .ci img{height:28px}
  .page-head.band{padding:22px 20px}
  .band::before,.page-head.band::before{width:280px;height:200px;right:-190px;top:-120px}
  .band::after,.page-head.band::after{width:280px;height:200px;right:-182px;top:-112px;border-bottom-width:4px}
  .hero.band{padding:30px 22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

function scoresOf(a){
  const pts = q => (typeof a[q.id] === 'number' && FREQ_PTS[a[q.id]] != null) ? FREQ_PTS[a[q.id]] : null;
  const p3 = SCORE_QS.filter(q => q.sec === 's3').map(pts).filter(v => v != null);
  const p4 = SCORE_QS.filter(q => q.sec === 's4').map(pts).filter(v => v != null);
  return { score: mean(p3.concat(p4)), s3: mean(p3), s4: mean(p4) };
}
function X(r){
  let c = cache.get(r);
  if (c && c.ga === S.config.gradeA && c.gb === S.config.gradeB) return c;
  const a = r.a || {};
  const sc = scoresOf(a);
  const bad = STATUS_QS.filter(q => a[q.id] === 2).map(q => ({ q, reason: a[q.id + '_reason'] || '', photos: (r.photos || {})[q.id] || [] }));

}

/* photo upload */
async function compress(file){
  const type = (file.type || '').toLowerCase();
  let src;
  try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) {
    try { src = await new Promise((res, rej) => { const u = URL.createObjectURL(file); const im = new Image(); im.onload = () => { res(im); }; im.onerror = rej; im.src = u; }); }
    catch (e2) {
      if (/^image\/(jpeg|png|webp)$/.test(type) && file.size < 19 * 1024 * 1024) return file;
      throw { code: 'decode' };
    }
  }
  const w = src.width || src.naturalWidth, h = src.height || src.naturalHeight;
  const s = Math.min(1, 1920 / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.8));
  if (!blob) { if (/^image\/(jpeg|png|webp)$/.test(type)) return file; throw { code: 'decode' }; }
  return blob;
}
function photoErrMsg(e){
  const c = e && e.code;
  if (c === 'decode') return '이 사진 형식은 열 수 없습니다. JPG로 저장된 사진을 선택해 주세요.';
  if (c === 'too_large') return '사진 용량이 너무 큽니다.';
  if (c === 'quota_or_state') return '저장 공간이 가득 찼습니다. 관리자에게 알려 주세요.';
  if (c === 'rate_limited') return '잠시 후 다시 시도해 주세요.';
  if (c === 'not_granted' || c === 'capability_disabled') return '사진을 올릴 권한이 없습니다.';
  return '업로드에 실패했습니다. 통신 상태를 확인해 주세요.';
}
function toB64(blob){ return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1] || ''); fr.onerror = rej; fr.readAsDataURL(blob); }); }
async function uploadOne(blob){
  const data = await toB64(blob);
  const mime = /^image\/(jpeg|png|webp)$/.test(blob.type || '') ? blob.type : 'image/jpeg';
  let id;
  try { id = await call('apiUploadPhoto', { data, mime }); }
  catch (e) { await new Promise(r => setTimeout(r, 1000)); id = await call('apiUploadPhoto', { data, mime }); }
  try { PREV[id] = URL.createObjectURL(blob); } catch (e) {}
  return { id };
}
async function handleFiles(k, files){
  if (!assetsOn() || !files.length) return;
  S.ui.touched = true;
  const spec = PHOTO_KEYS[k];
  const room = spec.max - photoList(k).length - (S.ui.uploading[k] || 0);
  const list = files.slice(0, Math.max(0, room));
  if (files.length > list.length) toast(`최대 ${spec.max}장까지 첨부할 수 있습니다.`);
  S.ui.photoErr[k] = ''; S.ui.failed[k] = [];
  await Promise.all(list.map(async f => {
    S.ui.uploading[k] = (S.ui.uploading[k] || 0) + 1; rerenderPhotos(k);
    try {
      const blob = await compress(f);
      const r = await uploadOne(blob);
      (S.form.photos[k] = S.form.photos[k] || []).push(r.id); saveDraft();
    } catch (e) {
      S.ui.photoErr[k] = photoErrMsg(e);
      if (!(e && e.code === 'decode')) S.ui.failed[k].push(f);
    } finally {
      S.ui.uploading[k]--; rerenderPhotos(k); updateProgress();
    }
  }));
  if (S.ui.showMissing) rerenderQ(k);
}

/* ---------- stats ---------- */
function basic(list){
  const g = { A: 0, B: 0, C: 0 };
  list.forEach(r => g[X(r).grade]++);
  return { n: list.length, sites: new Set(list.map(r => r.info.site)).size, avg: mean(list.map(r => X(r).score)), g };
}
function dist(list, id, nOpts){
  const c = Array(nOpts).fill(0); let n = 0;
  list.forEach(r => { const v = r.a[id]; if (Array.isArray(v)) { n++; v.forEach(i => { if (i < nOpts) c[i]++; }); } else if (typeof v === 'number' && v < nOpts) { n++; c[v]++; } });
  return { c, n };
}
function ansText(q, r){
  const a = r.a, v = a[q.id];
  if (q.type === 'freq') return typeof v === 'number' ? FREQ[v] : '';
  if (q.type === 'likert') return typeof v === 'number' ? LIKERT[v] : '';
  if (q.type === 'status') return typeof v === 'number' ? STATUS[v] : '';
  if (q.type === 'single'){
    let t = typeof v === 'number' ? q.opts[v] : '';

/* ---------- charts (hand-drawn SVG) ---------- */
function drawCharts(){
  $$('[data-chart]').forEach(el => {
    const sp = CH[el.dataset.chart]; if (!sp) return;
    const W = el.clientWidth || 600;
    el.innerHTML = sp.kind === 'vbar' ? vbarSvg(W, sp) : sp.kind === 'line' ? lineSvg(W, sp) : sp.kind === 'donut' ? donutSvg(W, sp) : '';
  });
}
function topRound(x, y, w, h, r){
  if (h <= 0.5) return ''; r = Math.min(r, h, w / 2);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}
function vbarSvg(W, sp){
  const items = sp.items, n = items.length;
  if (!n) return '<div class="chart-empty">응답이 들어오면 현장별 점수가 표시됩니다.</div>';
  W = Math.max(280, Math.floor(W));
  const rot = (W - 74) / n < 54;
  const H = 300, pl = 34, pr = 40, pt = 14, pb = rot ? 92 : 30;
  const iw = W - pl - pr, ih = H - pt - pb, step = iw / n, bw = Math.max(6, Math.min(42, step * 0.62));
  const y = v => pt + ih * (1 - v / 100);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(sp.label)}">`;
  [0, 25, 50, 75, 100].forEach(t => { s += `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}" class="gl${t === 0 ? ' base' : ''}"/><text x="${pl - 8}" y="${y(t) + 4}" class="tk" text-anchor="end">${t}</text>`; });
  items.forEach((it, i) => {
    const x0 = pl + step * i, cx = x0 + step / 2, v = Math.max(0, Math.min(100, it.value));
    s += `<path d="${topRound(cx - bw / 2, y(v), bw, ih * v / 100, 4)}" fill="${it.color}"/>`;
    s += `<rect x="${x0}" y="${pt}" width="${step}" height="${ih}" fill="transparent" data-tip="${esc(it.tip)}"/>`;
    const lab = esc(trunc(it.label, rot ? 10 : 7));
    s += rot ? `<text class="xl" text-anchor="end" transform="translate(${cx + 4},${pt + ih + 14}) rotate(-40)">${lab}</text>` : `<text class="xl" x="${cx}" y="${pt + ih + 19}" text-anchor="middle">${lab}</text>`;
  });
  (sp.th || []).forEach(t => { s += `<line x1="${pl}" x2="${W - pr}" y1="${y(t.v)}" y2="${y(t.v)}" class="th"/><text x="${W - pr + 4}" y="${y(t.v) + 4}" class="thl">${esc(t.l.split(' ')[0])}</text>`; });
  return s + '</svg>';
}
function lineSvg(W, sp){
  const pts = sp.pts, n = pts.length;
  if (!n) return '<div class="chart-empty">점검일이 입력된 응답이 들어오면 표시됩니다.</div>';
  W = Math.max(280, Math.floor(W));
  const H = 260, pl = 34, pr = 26, pt = 22, pb = 30, iw = W - pl - pr, ih = H - pt - pb;
  const x = i => n === 1 ? pl + iw / 2 : pl + iw * i / (n - 1);
  const y = v => pt + ih * (1 - v / 100);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="월별 평균 점수 추이">`;
  [0, 25, 50, 75, 100].forEach(t => { s += `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}" class="gl${t === 0 ? ' base' : ''}"/><text x="${pl - 8}" y="${y(t) + 4}" class="tk" text-anchor="end">${t}</text>`; });
  if (n > 1){
    const d = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i)},${y(p.value)}`).join('');
    s += `<path class="ar" d="${d}L${x(n - 1)},${y(0)}L${x(0)},${y(0)}Z"/><path class="ln" d="${d}"/>`;
  }
  const every = n > 8 ? 2 : 1;
  pts.forEach((p, i) => {
    s += `<circle class="mk" cx="${x(i)}" cy="${y(p.value)}" r="5"/><circle cx="${x(i)}" cy="${y(p.value)}" r="16" fill="transparent" data-tip="${esc(`${p.label}\n평균 ${fmt1(p.value)}점 · ${p.n}건`)}"/>`;
    if (i === n - 1 || n <= 6) s += `<text class="vl" x="${x(i)}" y="${y(p.value) - 11}" text-anchor="middle">${fmt1(p.value)}</text>`;
    if (i % every === 0 || i === n - 1) s += `<text class="xl" x="${x(i)}" y="${H - 8}" text-anchor="${n > 1 && i === 0 ? 'start' : n > 1 && i === n - 1 ? 'end' : 'middle'}">${esc(p.label)}</text>`;
  });
  return s + '</svg>';
}
function donutSvg(W, sp){
  const size = Math.min(240, Math.max(180, Math.floor(W))), cx = size / 2, R = size / 2 - 22, T = 34, C = 2 * Math.PI * R;
  const total = sp.segs.reduce((s, x) => s + x.value, 0);
  let s = `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="등급별 분포">`;
  if (!total) s += `<circle cx="${cx}" cy="${cx}" r="${R}" fill="none" stroke="var(--line-2)" stroke-width="${T}"/>`;
  else {
    let off = 0; const live = sp.segs.filter(x => x.value > 0); const gap = live.length > 1 ? 3 : 0;
    live.forEach(x => {
      const len = C * x.value / total;
      s += `<circle cx="${cx}" cy="${cx}" r="${R}" fill="none" stroke="${x.color}" stroke-width="${T}" stroke-dasharray="${Math.max(0.1, len - gap)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cx})" data-tip="${esc(`${x.label} ${x.value}건 (${Math.round(x.value / total * 100)}%)`)}"/>`;
      off += len;
    });
  }
  s += `<text class="ctr" x="${cx}" y="${cx + 4}" text-anchor="middle">${total}</text><text class="ctr2" x="${cx}" y="${cx + 24}" text-anchor="middle">건</text>`;
  return s + '</svg>';
}

let deleting = false;
async function deleteResp(rid){
  const r = S.responses.find(x => x.rid === rid); if (!r || deleting) return;
  deleting = true;
  try {
    const res = await call('apiAdminDelete', S.adminPw, rid);
    S.responses = S.responses.filter(x => x.rid !== rid);
    S.summary = { total: S.responses.length, sites: new Set(S.responses.map(x => x.info.site)).size };
    S.ui.confirmRow = null; S.ui.expanded.delete(rid);
    if (!$('#modal').hidden) closeModal();
    render();
    toast(res && res.ok === false ? '이미 삭제된 응답입니다.' : `${r.info.site} 응답을 삭제했습니다.`);
  } catch (e) { toast(errText(e).indexOf('AUTH') >= 0 ? '관리자 로그인이 풀렸습니다. 다시 로그인해 주세요.' : '삭제하지 못했습니다. 잠시 후 다시 시도해 주세요.'); }
  deleting = false;
}

/* ---------- share with field ---------- */
function surveyLink(){ return S.links.web ? S.links.web + '?page=survey' : ''; }
function shareText(){
  const c = S.config, link = surveyLink();
  return `[스마트CM] 2026 연말 태블릿PC 사용 보고 설문 안내

2026년 한 해 동안의 태블릿PC 활용 실적을 아래 링크에서 보고해 주세요.

▶ 설문 링크: ${link}
${c.deadline ? `▶ 제출 마감: ${c.deadline}\n` : ''}
· 로그인 없이 링크만 누르면 바로 작성할 수 있습니다.
· 39문항이며, 기기 전면·후면 사진 2장은 꼭 첨부해 주세요.
· 기기가 여러 대이면 기기마다 1건씩 제출해 주세요.
· 작성 중 통신이 끊겨도 내용은 기기에 저장됩니다.`;
}
function qrSvg(text, cell){
  if (typeof qrcode === 'undefined' || !text) return '';
  try { const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({ cellSize: cell || 5, margin: 2, scalable: true }); } catch (e) { return ''; }
}
function shareHtml(){
  const link = surveyLink(), qr = qrSvg(link, 5);
  return `<div class="m-head"><div><h3>현장 공유</h3><p class="meta">현장 담당자에게 보낼 링크와 안내문, 현장 게시용 QR 코드입니다.</p></div><button type="button" class="icon-btn" data-act="close-modal" aria-label="닫기">${I('x')}</button></div>
  <div class="m-body">${link ? `<div class="share-grid">
    <div class="share-main">
      <div class="fld"><label for="share-link">설문 바로가기 링크</label><div class="copy-row"><input class="inp" id="share-link" readonly value="${esc(link)}"><button type="button" class="btn primary" data-act="copy" data-src="share-link">링크 복사</button></div></div>
      <div class="fld"><label for="share-msg">카카오톡·메일 안내문</label><textarea class="inp" id="share-msg" readonly style="min-height:236px">${esc(shareText())}</textarea><div style="margin-top:8px"><button type="button" class="btn" data-act="copy" data-src="share-msg">안내문 복사</button></div></div>
    </div>
    <div class="share-qr">
      <div class="qr-box">${qr || '<p class="muted">QR 코드를 만들지 못했습니다.</p>'}</div>
      <p class="help" style="text-align:center">태블릿 카메라로 찍으면 설문이 바로 열립니다.</p>
      ${qr ? `<button type="button" class="btn" data-act="qr-dl">${I('dl')} QR 이미지 저장</button>` : ''}
    </div>
  </div>
  <div class="notice info" style="margin:18px 0 0">${I('info')}<div>이 링크는 <b>로그인 없이 누구나</b> 열어 설문을 제출할 수 있습니다. 대시보드는 관리자 비밀번호가 있어야 열리고, 현장에서는 다른 현장의 점수를 볼 수 없습니다.</div></div>`
  : `<p class="pn-empty">웹앱 주소를 아직 알 수 없습니다. Apps Script에서 [배포 > 새 배포]로 웹앱을 배포한 뒤, 배포된 주소로 이 페이지를 열어 주세요.</p>`}
  </div>`;
}
async function copyFrom(id, btn){
  const el = document.getElementById(id); if (!el) return;
  try { await navigator.clipboard.writeText(el.value); const t = btn.textContent; btn.textContent = '복사했습니다'; setTimeout(() => { btn.textContent = t; }, 1600); }
  catch (e) { el.focus(); el.select(); try { if (document.execCommand('copy')) { toast('복사했습니다.'); return; } } catch (x) {} toast('선택된 내용을 길게 눌러 복사해 주세요.'); }
}
async function saveQr(){
  if (typeof qrcode === 'undefined' || !surveyLink()) return;
  const q = qrcode(0, 'M'); q.addData(surveyLink()); q.make();
  const n = q.getModuleCount(), cell = 16, m = 4, size = (n + m * 2) * cell, pad = 90;
  const cv = document.createElement('canvas'); cv.width = size; cv.height = size + pad;
  const g = cv.getContext('2d'); g.fillStyle = '#ffffff'; g.fillRect(0, 0, cv.width, cv.height); g.fillStyle = '#102079';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) g.fillRect((c + m) * cell, (r + m) * cell, cell, cell);
  g.fillStyle = '#131a38'; g.textAlign = 'center'; g.font = '700 30px "Noto Sans KR", sans-serif';
  g.fillText('2026 연말 태블릿PC 사용 보고', size / 2, size + 26);
  g.font = '500 22px "Noto Sans KR", sans-serif'; g.fillStyle = '#4a5272';
  g.fillText(S.config.deadline ? `제출 마감 ${S.config.deadline}` : '카메라로 찍으면 설문이 열립니다', size / 2, size + 64);
  const url = cv.toDataURL('image/png');
  try { const a = document.createElement('a'); a.href = url; a.download = '2026_태블릿PC_설문_QR.png'; document.body.appendChild(a); a.click(); a.remove(); } catch (e) {}
  const lb = $('#lightbox');
  lb.innerHTML = `<button type="button" class="icon-btn" data-act="close-lb" aria-label="닫기">${I('x')}</button><img src="${url}" alt="설문 QR 코드" data-full="1"><p>저장되지 않았다면 이미지를 길게 누르거나 오른쪽 버튼으로 눌러 저장하세요.</p>`;
  lb.hidden = false; document.body.classList.add('noscroll');
}
function openLightbox(id, cap){
  const lb = $('#lightbox');
  lb.innerHTML = `<button type="button" class="icon-btn" data-act="close-lb" aria-label="닫기">${I('x')}</button><img src="${photoSrc(id)}" alt="${esc(cap)}" id="lb-img"><p>${esc(cap)}</p>`;
  lb.hidden = false; document.body.classList.add('noscroll');
  if (S.isAdmin && !/^blob:/.test(PREV[id] || '')){
    call('apiAdminPhoto', S.adminPw, id).then(u => { const im = $('#lb-img'); if (im && u) { im.dataset.full = '1'; im.src = u; } }).catch(() => {});
  }
}
function closeLightbox(){ const lb = $('#lightbox'); lb.hidden = true; lb.innerHTML = ''; if ($('#modal').hidden) document.body.classList.remove('noscroll'); }

/* ---------- toast & tooltip ---------- */
let toastTimer = null;
function toast(msg, ms){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, ms || 3200); }
const tip = $('#tip');
function showTip(el, x, y){
  const t = el.getAttribute('data-tip'); if (!t){ tip.hidden = true; return; }
  tip.textContent = t; tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let lx = x + 14, ly = y - h - 12;
  if (lx + w > innerWidth - 8) lx = x - w - 14;
  if (ly < 8) ly = y + 18;
  tip.style.left = Math.max(8, lx) + 'px'; tip.style.top = ly + 'px';
}
document.addEventListener('pointermove', e => { if (e.pointerType === 'touch') return; const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el, e.clientX, e.clientY); else tip.hidden = true; });
document.addEventListener('pointerdown', e => { if (e.pointerType !== 'touch') return; const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el, e.clientX, e.clientY); else tip.hidden = true; });
window.addEventListener('scroll', () => { tip.hidden = true; }, { passive: true });

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) { if (e.target.id === 'modal') closeModal(); if (e.target.id === 'lightbox') closeLightbox(); return; }
  const act = t.dataset.act, q = t.dataset.q, i = Number(t.dataset.i);
  switch (act){
    case 'choose': {
      S.ui.touched = true;
      S.form.a[q] = i; saveDraft(); rerenderQ(q); updateProgress(); break;
    }
    case 'toggle': {
      S.ui.touched = true;
      const qq = QMAP[q];
      let arr = Array.isArray(S.form.a[q]) ? S.form.a[q].slice() : [];
      if (arr.includes(i)) arr = arr.filter(x => x !== i);
      else {
        if (qq && qq.excl != null) arr = i === qq.excl ? [] : arr.filter(x => x !== qq.excl);
        if (qq && qq.max && arr.length >= qq.max) break;
        arr.push(i);
      }
      S.form.a[q] = arr; saveDraft(); rerenderQ(q === '6-11_items' ? '6-11' : q); updateProgress(); break;
    }
    case 'rm-photo': {
      const id = t.dataset.id;
      S.form.photos[q] = photoList(q).filter(x => x !== id); saveDraft();
      call('apiDeletePhoto', id).catch(() => {});
      rerenderPhotos(q); updateProgress(); break;
    }
    case 'retry-photo': { const files = (S.ui.failed[q] || []).slice(); S.ui.failed[q] = []; handleFiles(q, files); break; }
    case 'jump': { const el = $('#sec-' + t.dataset.sec); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); break; }
    case 'submit': submit(); break;
    case 'new-survey': S.ui.submitted = null; render(); window.scrollTo(0, 0); break;
    case 'kpi-grade': S.ui.filters.grade = t.dataset.g; S.ui.shown = 30; render(); $('#results').scrollIntoView({ behavior: 'smooth', block: 'start' }); break;
    case 'expand': { const rid = t.dataset.rid; S.ui.expanded.has(rid) ? S.ui.expanded.delete(rid) : S.ui.expanded.add(rid); refreshRows(); break; }
    case 'detail': { const r = findResp(t.dataset.rid); if (r) openModal(detailHtml(r)); break; }
    case 'close-modal': closeModal(); break;
    case 'lightbox': openLightbox(t.dataset.id, t.dataset.cap || ''); break;
    case 'close-lb': closeLightbox(); break;
    case 'gtab': S.ui.gtab = t.dataset.tab; { const g = $('#gallery'); if (g) g.outerHTML = galleryCard(data()); } break;
    case 'f-bad': S.ui.filters.bad = !S.ui.filters.bad; S.ui.shown = 30; refreshList(); break;
    case 'f-clear': S.ui.filters = { q: '', site: '', leader: '', inspector: '', grade: '', trade: '', device: '', month: '', bad: false }; S.ui.shown = 30; refreshList(); break;
    case 'more': S.ui.shown += 30; refreshList(); break;
    case 'settings': openModal(settingsHtml()); break;
    case 'save-settings': saveSettings(); break;
    case 'del-ask': S.ui.confirmDel = t.dataset.rid; { const r = findResp(t.dataset.rid); if (r) $('#modal-panel').innerHTML = detailHtml(r); } break;
    case 'del-cancel': { const rid = S.ui.confirmDel; S.ui.confirmDel = null; const r = findResp(rid); if (r) $('#modal-panel').innerHTML = detailHtml(r); } break;
    case 'del-yes': deleteResp(t.dataset.rid); break;
    case 'row-del': S.ui.confirmRow = t.dataset.rid; refreshRows(); break;
    case 'row-del-cancel': S.ui.confirmRow = null; refreshRows(); break;
    case 'share': openModal(shareHtml()); break;
    case 'refresh': refreshAdmin(false); break;
    case 'logout': adminLogout(); break;
    case 'copy': copyFrom(t.dataset.src, t); break;
    case 'qr-dl': saveQr(); break;
  }
});
function refreshRows(){ const el = $('#results'); if (el) el.innerHTML = listCard(data()); }
function refreshList(){
  const el = $('#results'); if (!el) return;
  const focusId = document.activeElement && document.activeElement.id, pos = focusId === 'f-q' ? document.activeElement.selectionStart : null;
  el.innerHTML = listCard(data());
  if (focusId){ const f = document.getElementById(focusId); if (f){ f.focus({ preventScroll: true }); if (pos != null) try { f.setSelectionRange(pos, pos); } catch (e) {} } }
}
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.field){
    S.ui.touched = true;
    const k = t.dataset.field; S.form.info[k] = t.value; saveDraft();
    if (t.tagName !== 'SELECT') updateProgress();
  } else if (t.dataset.q && QMAP[t.dataset.q]){
    S.ui.touched = true; S.form.a[t.dataset.q] = t.value; saveDraft(); updateProgress();
  } else if (t.dataset.etc){ S.form.a[t.dataset.etc + '_etc'] = t.value; saveDraft(); }
  else if (t.dataset.reason){ S.form.a[t.dataset.reason + '_reason'] = t.value; saveDraft(); }
  else if (t.dataset.filter === 'q'){ S.ui.filters.q = t.value; S.ui.shown = 30; refreshList(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.photo){ const files = Array.from(t.files || []); t.value = ''; handleFiles(t.dataset.photo, files); return; }
  if (t.dataset.filter && t.dataset.filter !== 'q'){ S.ui.filters[t.dataset.filter] = t.value; S.ui.shown = 30; refreshList(); return; }
  if (t.dataset.field === 'site'){
    const f = S.form.info, s = S.config.sites.find(x => x.name === t.value);
    if (s && s.leader && (!f.leader || f.leader === f.leaderAuto)){ f.leader = s.leader; f.leaderAuto = s.leader; }
    saveDraft(); $('#sec-info').innerHTML = infoCard(); updateProgress();
    if (t.value === '__custom'){ const c = $('#f-siteCustom'); if (c) c.focus(); }
  } else if (t.dataset.field === 'device' || t.dataset.field === 'trade'){
    saveDraft(); if (t.dataset.field === 'device'){ $('#sec-info').innerHTML = infoCard(); if (t.value === '__custom'){ const c = $('#f-deviceCustom'); if (c) c.focus(); } }
  }
});
document.addEventListener('submit', e => { if (e.target && e.target.id === 'login-form'){ e.preventDefault(); adminLogin(($('#admin-pw') || {}).value || ''); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ if (!$('#lightbox').hidden) closeLightbox(); else if (!$('#modal').hidden) closeModal(); } });
let rzTimer = null;
window.addEventListener('resize', () => { clearTimeout(rzTimer); rzTimer = setTimeout(() => { if (S.route === 'dashboard') drawCharts(); }, 180); });

/* ---------- start ---------- */
S.route = routeFromHash();
render();
try {
  google.script.url.getLocation(loc => {
    const pg = String((loc && loc.parameter && loc.parameter.page) || (loc && loc.hash) || '').replace('#', '');
    const r = pg === 'admin' ? 'dashboard' : pg;
    if ((r === 'survey' || r === 'dashboard') && r !== S.route) location.hash = r;
  });
} catch (e) {}
init();
})();
</script>
</body>
</html>
